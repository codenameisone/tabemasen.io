<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- This page moved to /gluten-free-japan/.
       GitHub Pages serves static files only, so a real HTTP 301 is not
       available. The canonical below is the signal to search engines; the
       refresh and the script are the redirect for people. Deliberately NOT
       noindex: combining noindex with rel=canonical sends contradictory
       signals about the target, and this URL was never indexed anyway. -->
  <link rel="canonical" href="https://tabemasen.io/gluten-free-japan/">
  <meta http-equiv="refresh" content="0; url=https://tabemasen.io/gluten-free-japan/">

  <title>Moved — Gluten-Free in Japan | tabemasen</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/styles.css">

  <script>
    // Preserve any query string and hash — the card generator keeps its state
    // in the hash, so a shared link must survive the hop.
    location.replace('/gluten-free-japan/' + location.search + location.hash);
  </script>
</head>
<body>
  <main class="main-content" style="max-width:40rem;margin:0 auto;padding:4rem 1.5rem;">
    <h1>This page has moved</h1>
    <p>
      The gluten-free guide now lives at
      <a href="/gluten-free-japan/">tabemasen.io/gluten-free-japan/</a>.
      You should be redirected automatically.
    </p>
    <p><a href="/">← Generate a Japanese restaurant card</a></p>
  </main>
</body>
</html>
